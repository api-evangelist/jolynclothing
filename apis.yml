aid: jolynclothing
name: JOLYN
description: >-
  JOLYN is an athletic swimwear and apparel brand for competitive and team swimming, water polo,
  and aquatics, known for durable, functional practice and racing suits, team uniforms, and active
  lifestyle apparel. Surfaced as a portfolio company of Norwest Venture Partners and added to the
  API Evangelist network, JOLYN publishes no first-party developer API — its direct-to-consumer
  storefront at jolyn.com (jolynclothing.com redirects here) is Shopify-hosted. That platform exposes
  a genuine agent-native commerce surface: a published /llms.txt with agent instructions, OpenID
  Connect discovery for the Shopify Customer Account API, and a live Universal Commerce Protocol (UCP)
  MCP endpoint for buyer-approved, agent-driven shopping and checkout.
